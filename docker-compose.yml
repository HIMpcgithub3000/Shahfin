services:
  voicebot:
    build:
      context: .
      dockerfile: Dockerfile
    image: shaha-finlease-voicebot:latest
    container_name: shaha_finlease_voicebot
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist generated audio recordings on the host machine
      - ./audio_recordings:/app/audio_recordings
      # Mount data folder for customer & scenario CSVs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/customers"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

